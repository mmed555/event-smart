<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="seGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Rounded Base Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#seGrad)"/>
  
  <!-- Inner Subtle Border -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
  
  <!-- "SE" Typography & Sparkle Icon -->
  <text x="24" y="43" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="27" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-1">SE</text>
  
  <!-- AI Sparkle / Magic Star -->
  <path d="M47 16 Q47 23 54 23 Q47 23 47 30 Q47 23 40 23 Q47 23 47 16 Z" fill="#38bdf8" filter="url(#glow)"/>
</svg>
