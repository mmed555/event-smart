<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" width="100%" height="100%" style="font-family: 'Plus Jakarta Sans', 'Cairo', sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="actorGradRtl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="aiUcGradRtl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
    <linearGradient id="payUcGradRtl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <linearGradient id="defaultUcGradRtl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    
    <!-- Shadows & Filters -->
    <filter id="cardShadowRtl" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="actorGlowRtl" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#4f46e5" flood-opacity="0.35"/>
    </filter>
  </defs>

  <style>
    .uc-box { transition: all 0.25s ease; cursor: pointer; }
    .uc-box:hover rect { stroke: #4f46e5; stroke-width: 2.5px; filter: url(#actorGlowRtl); }
    .uc-text { font-size: 11.5px; font-weight: 700; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
    .uc-num { font-size: 9.5px; font-weight: 800; text-anchor: middle; }
    .conn-line { stroke: #cbd5e1; stroke-width: 1.6; stroke-dasharray: 4,4; fill: none; transition: stroke 0.3s; }
    .uc-box:hover ~ .conn-line, .conn-line:hover { stroke: #4f46e5; stroke-width: 2.5; stroke-dasharray: none; }
  </style>

  <!-- BACKGROUND SYSTEM BOUNDARY -->
  <rect x="25" y="15" width="750" height="410" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="25" y="15" width="750" height="38" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="400" y="38" text-anchor="middle" font-size="12" font-weight="800" fill="#475569" letter-spacing="0.5">
    SMARTEVENT PLATFORM — ATTENDEE ACTOR USE CASE BOUNDARY
  </text>

  <!-- COLUMN HEADERS (4 HORIZONTAL DOMAINS FROM RIGHT TO LEFT) -->
  <text x="690" y="70" text-anchor="middle" font-size="11" font-weight="800" fill="#6366f1">1. AUTH &amp; DISCOVERY</text>
  <text x="510" y="70" text-anchor="middle" font-size="11" font-weight="800" fill="#9333ea">2. AI &amp; SELECTION</text>
  <text x="330" y="70" text-anchor="middle" font-size="11" font-weight="800" fill="#059669">3. BOOKING &amp; TICKETS</text>
  <text x="140" y="70" text-anchor="middle" font-size="11" font-weight="800" fill="#0284c7">4. PASSES &amp; PROFILE</text>

  <!-- CONNECTING BEZIER CURVES FROM ACTOR (RIGHT) TO 12 USE CASES -->
  <!-- Col 1 (Rightmost) -->
  <path d="M 800 220 C 760 220, 720 115, 690 115" class="conn-line"/>
  <path d="M 800 220 C 760 220, 720 225, 690 225" class="conn-line"/>
  <path d="M 800 220 C 760 220, 720 335, 690 335" class="conn-line"/>

  <!-- Col 2 -->
  <path d="M 800 220 C 700 220, 560 115, 510 115" class="conn-line"/>
  <path d="M 800 220 C 700 220, 560 225, 510 225" class="conn-line"/>
  <path d="M 800 220 C 700 220, 560 335, 510 335" class="conn-line"/>

  <!-- Col 3 -->
  <path d="M 800 220 C 650 220, 400 115, 330 115" class="conn-line"/>
  <path d="M 800 220 C 650 220, 400 225, 330 225" class="conn-line"/>
  <path d="M 800 220 C 650 220, 400 335, 330 335" class="conn-line"/>

  <!-- Col 4 (Leftmost) -->
  <path d="M 800 220 C 600 220, 220 115, 140 115" class="conn-line"/>
  <path d="M 800 220 C 600 220, 220 225, 140 225" class="conn-line"/>
  <path d="M 800 220 C 600 220, 220 335, 140 335" class="conn-line"/>

  <!-- ================= ACTOR (ATTENDEE) RIGHT SIDE ================= -->
  <g transform="translate(800, 140)">
    <!-- Glow Backing -->
    <rect x="0" y="0" width="115" height="160" rx="20" fill="url(#actorGradRtl)" filter="url(#actorGlowRtl)"/>
    
    <!-- Modern Avatar Graphic -->
    <circle cx="57.5" cy="48" r="20" fill="#ffffff"/>
    <path d="M 28 100 C 28 76, 87 76, 87 100 Z" fill="#ffffff"/>
    <rect x="40" y="103" width="35" height="4" rx="2" fill="rgba(255,255,255,0.4)"/>
    
    <!-- Actor Label (Clean Attendee without Arabic subtext) -->
    <text x="57.5" y="132" text-anchor="middle" font-size="14.5" font-weight="900" fill="#ffffff" letter-spacing="0.3">Attendee</text>
  </g>

  <!-- ================= 12 USE CASE CAPSULES (4 COLS x 3 ROWS) ================= -->

  <!-- COLUMN 1 (RIGHT): AUTH & DISCOVERY -->
  <!-- UC 1: Register / Login -->
  <g class="uc-box" transform="translate(615, 85)">
    <rect x="0" y="0" width="150" height="60" rx="30" fill="url(#defaultUcGradRtl)" stroke="#cbd5e1" stroke-width="1.6" filter="url(#cardShadowRtl)"/>
    <text x="75" y="24" class="uc-num" fill="#6366f1">UC-01</text>
    <text x="75" y="42" class="uc-text">Register / Login</text>
  </g>

  <!-- UC 2: Browse Events -->
  <g class="uc-box" transform="translate(615, 195)">
    <rect x="0" y="0" width="150" height="60" rx="30" fill="url(#defaultUcGradRtl)" stroke="#cbd5e1" stroke-width="1.6" filter="url(#cardShadowRtl)"/>
    <text x="75" y="24" class="uc-num" fill="#6366f1">UC-02</text>
    <text x="75" y="42" class="uc-text">Browse &amp; Filter Events</text>
  </g>

  <!-- UC 3: Search Events -->
  <g class="uc-box" transform="translate(615, 305)">
    <rect x="0" y="0" width="150" height="60" rx="30" fill="url(#defaultUcGradRtl)" stroke="#cbd5e1" stroke-width="1.6" filter="url(#cardShadowRtl)"/>
    <text x="75" y="24" class="uc-num" fill="#6366f1">UC-03</text>
    <text x="75" y="42" class="uc-text">Keyword Search</text>
  </g>

  <!-- COLUMN 2: AI & SELECTION -->
  <!-- UC 4: AI Conversational Search (Highlighted) -->
  <g class="uc-box" transform="translate(435, 85)">
    <rect x="0" y="0" width="150" height="60" rx="30" fill="url(#aiUcGradRtl)" stroke="#9333ea" stroke-width="2" filter="url(#cardShadowRtl)"/>
    <text x="75" y="24" class="uc-num" fill="#7c3aed">✨ UC-04 (AI NLP)</text>
    <text x="75" y="42" class="uc-text" fill="#6b21a8">Conversational Search</text>
  </g>

  <!-- UC 5: AI Recommendations -->
  <g class="uc-box" transform="translate(435, 195)">
    <rect x="0" y="0" width="150" height="60" rx="30" fill="url(#aiUcGradRtl)" stroke="#9333ea" stroke-width="2" filter="url(#cardShadowRtl)"/>
    <text x="75" y="24" class="uc-num" fill="#7c3aed">✨ UC-05 (AI Rec)</text>
    <text x="75" y="42" class="uc-text" fill="#6b21a8">AI Recommendations</text>
  </g>

  <!-- UC 6: View Event Details -->
  <g class="uc-box" transform="translate(435, 305)">
    <rect x="0" y="0" width="150" height="60" rx="30" fill="url(#defaultUcGradRtl)" stroke="#cbd5e1" stroke-width="1.6" filter="url(#cardShadowRtl)"/>
    <text x="75" y="24" class="uc-num" fill="#6366f1">UC-06</text>
    <text x="75" y="42" class="uc-text">View Event Agenda</text>
  </g>

  <!-- COLUMN 3: BOOKING & TICKETS -->
  <!-- UC 7: Book Tickets & Tiers -->
  <g class="uc-box" transform="translate(255, 85)">
    <rect x="0" y="0" width="150" height="60" rx="30" fill="url(#payUcGradRtl)" stroke="#10b981" stroke-width="2" filter="url(#cardShadowRtl)"/>
    <text x="75" y="24" class="uc-num" fill="#047857">🎟️ UC-07 (Booking)</text>
    <text x="75" y="42" class="uc-text" fill="#065f46">Book Tickets &amp; Tier</text>
  </g>

  <!-- UC 8: Secure Payment Checkout -->
  <g class="uc-box" transform="translate(255, 195)">
    <rect x="0" y="0" width="150" height="60" rx="30" fill="url(#payUcGradRtl)" stroke="#10b981" stroke-width="2" filter="url(#cardShadowRtl)"/>
    <text x="75" y="24" class="uc-num" fill="#047857">💳 UC-08 (Payment)</text>
    <text x="75" y="42" class="uc-text" fill="#065f46">Secure Checkout</text>
  </g>

  <!-- UC 9: Cancel / Refund Ticket -->
  <g class="uc-box" transform="translate(255, 305)">
    <rect x="0" y="0" width="150" height="60" rx="30" fill="url(#defaultUcGradRtl)" stroke="#cbd5e1" stroke-width="1.6" filter="url(#cardShadowRtl)"/>
    <text x="75" y="24" class="uc-num" fill="#e11d48">UC-09</text>
    <text x="75" y="42" class="uc-text">Cancel &amp; Refund</text>
  </g>

  <!-- COLUMN 4 (LEFT): PASSES & PROFILE -->
  <!-- UC 10: Digital QR Ticket -->
  <g class="uc-box" transform="translate(65, 85)">
    <rect x="0" y="0" width="150" height="60" rx="30" fill="url(#defaultUcGradRtl)" stroke="#0284c7" stroke-width="1.8" filter="url(#cardShadowRtl)"/>
    <text x="75" y="24" class="uc-num" fill="#0284c7">📲 UC-10</text>
    <text x="75" y="42" class="uc-text">View QR Ticket</text>
  </g>

  <!-- UC 11: Push Notifications -->
  <g class="uc-box" transform="translate(65, 195)">
    <rect x="0" y="0" width="150" height="60" rx="30" fill="url(#defaultUcGradRtl)" stroke="#cbd5e1" stroke-width="1.6" filter="url(#cardShadowRtl)"/>
    <text x="75" y="24" class="uc-num" fill="#6366f1">UC-11</text>
    <text x="75" y="42" class="uc-text">Push Notifications</text>
  </g>

  <!-- UC 12: Manage Profile & Reviews -->
  <g class="uc-box" transform="translate(65, 305)">
    <rect x="0" y="0" width="150" height="60" rx="30" fill="url(#defaultUcGradRtl)" stroke="#cbd5e1" stroke-width="1.6" filter="url(#cardShadowRtl)"/>
    <text x="75" y="24" class="uc-num" fill="#6366f1">UC-12</text>
    <text x="75" y="42" class="uc-text">Profile &amp; Reviews</text>
  </g>
</svg>
