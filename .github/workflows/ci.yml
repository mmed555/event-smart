name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ─── Always-on checks & module detection ─────────────────────────────
  repo-checks:
    name: Repository Checks
    runs-on: ubuntu-latest
    outputs:
      has_backend: ${{ steps.detect.outputs.has_backend }}
      has_frontend: ${{ steps.detect.outputs.has_frontend }}
      has_ai: ${{ steps.detect.outputs.has_ai }}
    steps:
      - uses: actions/checkout@v4

      - name: Block .env files (except .env.example)
        run: |
          FOUND=$(git diff --cached --name-only --diff-filter=ACR 2>/dev/null || git diff --name-only origin/main...HEAD 2>/dev/null || echo "")
          BAD=$(echo "$FOUND" | grep -E '\.env($|\.)' | grep -v '\.env\.example' || true)
          if [ -n "$BAD" ]; then
            echo "::error::Blocked .env files: $BAD"
            exit 1
          fi
          echo "✅ No .env files detected"

      - name: Validate JSON files
        run: |
          find . -name '*.json' -not -path './node_modules/*' -not -path './.git/*' | while read f; do
            python3 -c "import json; json.load(open('$f'))" 2>&1 || { echo "::error::Invalid JSON: $f"; exit 1; }
          done
          echo "✅ All JSON files valid"

      - name: Detect active service modules
        id: detect
        run: |
          if [ -f "backend/package.json" ]; then
            echo "has_backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_backend=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -f "frontend/package.json" ]; then
            echo "has_frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_frontend=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -f "ai-service/requirements.txt" ]; then
            echo "has_ai=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_ai=false" >> "$GITHUB_OUTPUT"
          fi

  # ─── Backend (Node.js / TypeScript) ─────────────────────────────────
  backend:
    name: Backend
    runs-on: ubuntu-latest
    needs: [repo-checks]
    if: needs.repo-checks.outputs.has_backend == 'true'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm test --if-present

  # ─── Frontend (React / Vite / TypeScript) ───────────────────────────
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    needs: [repo-checks]
    if: needs.repo-checks.outputs.has_frontend == 'true'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm test --if-present

  # ─── AI Service (Python / FastAPI) ──────────────────────────────────
  ai-service:
    name: AI Service
    runs-on: ubuntu-latest
    needs: [repo-checks]
    if: needs.repo-checks.outputs.has_ai == 'true'
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check .

      - name: Test
        run: pytest --tb=short -q || true

  # ─── Unified status gate ────────────────────────────────────────────
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [repo-checks, backend, frontend, ai-service]
    if: always()
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.repo-checks.result }}" = "failure" ]; then
            echo "::error::repo-checks failed"
            exit 1
          fi
          if [ "${{ needs.backend.result }}" = "failure" ]; then
            echo "::error::backend failed"
            exit 1
          fi
          if [ "${{ needs.frontend.result }}" = "failure" ]; then
            echo "::error::frontend failed"
            exit 1
          fi
          if [ "${{ needs.ai-service.result }}" = "failure" ]; then
            echo "::error::ai-service failed"
            exit 1
          fi
          echo "✅ All checks passed or skipped"
